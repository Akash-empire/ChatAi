<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI Chatbot</title>

<style>
:root {
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-color: #f0f2f5;
    --chat-bg: #ffffff;
    --text-main: #2d3436;
    --text-muted: #636e72;
    --user-msg: #6c5ce7;
    --bot-msg: #f1f2f6;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

#chat-container {
    width: 450px;
    height: 650px;
    background: var(--chat-bg);
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    border-radius: 20px;
    overflow: hidden;
}

/* Header */
.chat-header {
    background: var(--primary-gradient);
    padding: 20px;
    color: white;
    text-align: center;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
}

/* Chat Area */
#chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
    background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px);
    background-size: 20px 20px; /* Subtle dot pattern */
}

/* Bubbles */
.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.4;
    position: relative;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.sent {
    align-self: flex-end;
    background: var(--user-msg);
    color: white;
    border-bottom-right-radius: 4px;
}

.received {
    align-self: flex-start;
    background: var(--bot-msg);
    color: var(--text-main);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.timestamp {
    font-size: 0.7rem;
    margin-top: 5px;
    opacity: 0.7;
    display: block;
}

/* Input Area */
.input-area {
    padding: 20px;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    border: 1px solid #dfe6e9;
    padding: 12px 15px;
    border-radius: 25px;
    outline: none;
    transition: border 0.3s;
}

input:focus {
    border-color: #6c5ce7;
}

button {
    background: var(--primary-gradient);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* Typing Indicator */
.typing {
    display: flex;
    gap: 4px;
    padding: 5px;
}
.typing span {
    width: 6px;
    height: 6px;
    background: #b2bec3;
    border-radius: 50%;
    animation: blink 1.4s infinite both;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
}
</style>
</head>

<body>

<div id="chat-container">
    <div class="chat-header">
        Gemini AI Assistant
    </div>
    
    <div id="chat">
        <div class="message received">
            Hello! How can I help you today?
            <span class="timestamp">Just now</span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msg" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
var API_KEY = "AIzaSyCS_tmR7Z7yoZLdV1l_jtJsh-obovwx-z4";

const chat = document.getElementById("chat");

// ================= MEMORY =================
let history = [];

// ================= SEND =================
function sendMessage(){
  let input = document.getElementById("msg");
  let text = input.value.trim();

  if(text==="") return;

  addMessage(text,"sent");
  input.value="";

  showTyping();

  setTimeout(async ()=>{
    removeTyping();

    let reply = await generateReply(text);

    addMessage(reply,"received");

  },800);
}

// ================= GEMINI API =================
async function generateReply(text) {
    // 1. Update history with user input
    history.push({
        role: "user",
        parts: [{ text: text }]
    });

    try {
        // Use the STABLE v1 endpoint instead of v1beta
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: history
                })
            }
        );

        // Check if the server actually returned a 200 OK
        if (!response.ok) {
            const errorData = await response.json();
            console.error("API Error Details:", errorData);
            return "Connection error. Please try again later. 🛠️";
        }

        const data = await response.json();

        // Safely extract the reply using Optional Chaining
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!reply) {
            return "I'm sorry, I couldn't generate a response. Please rephrase.";
        }

        // 2. Store AI reply in history for conversation context
        history.push({
            role: "model",
            parts: [{ text: reply }]
        });

        return reply;

    } catch (err) {
        console.error("Network Error:", err);
        return "Network error. Check your internet connection. 🌐";
    }
}

// ================= UI =================
function addMessage(content, type) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message " + type;

    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // Using innerHTML for formatting, but textContent for safety
    div.innerHTML = `
        <div class="text-content">${content}</div>
        <span class="timestamp">${time}</span>
    `;
    
    chat.appendChild(div);
    
    // Smooth scroll to bottom
    chat.scrollTo({
        top: chat.scrollHeight,
        behavior: 'smooth'
    });
}

function showTyping() {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message received";
    div.id = "typing";
    div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  let t=document.getElementById("typing");
  if(t) t.remove();
}

// ENTER KEY
document.getElementById("msg").addEventListener("keypress",function(e){
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
