<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI Chatbot</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
}

.chat-container{
  max-width:420px;
  height:95vh;
  margin:10px auto;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  overflow:hidden;
}

.chat-header{
  padding:12px;
  color:#fff;
  background:rgba(0,0,0,0.4);
  font-weight:bold;
}

.chat-body{
  flex:1;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.message{
  max-width:75%;
  padding:10px;
  margin:5px 0;
  border-radius:15px;
}

.sent{
  background:#00c853;
  color:#fff;
  margin-left:auto;
}

.received{
  background:rgba(255,255,255,0.2);
  color:#fff;
}

.message div{
  font-size:10px;
  text-align:right;
}

/* footer */
.chat-footer{
  display:flex;
  padding:10px;
  gap:5px;
  background:rgba(0,0,0,0.4);
}

.chat-footer input{
  flex:1;
  padding:10px;
  border-radius:30px;
  border:none;
}

.chat-footer button{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:#00c853;
  color:#fff;
  font-size:18px;
}

/* typing */
.typing span{
  width:6px;
  height:6px;
  background:#fff;
  display:inline-block;
  border-radius:50%;
  animation:blink 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}

@keyframes blink{
  0%,80%,100%{opacity:0;}
  40%{opacity:1;}
}
</style>
</head>

<body>

<div class="chat-container">

<div class="chat-header">Gemini AI Chat 🤖</div>

<div class="chat-body" id="chat"></div>

<div class="chat-footer">
  <input type="text" id="msg" placeholder="Type message...">
  <button onclick="sendMessage()">➤</button>
</div>

</div>

<script>
const API_KEY = "AIzaSyBGc2HI9VW2wGa0lP4GKJM-VLQVcDQbSjI";

const chat = document.getElementById("chat");

// ================= MEMORY =================
let history = [];

// ================= SEND =================
function sendMessage(){
  let input = document.getElementById("msg");
  let text = input.value.trim();

  if(text==="") return;

  addMessage(text,"sent");
  input.value="";

  showTyping();

  setTimeout(async ()=>{
    removeTyping();

    let reply = await generateReply(text);

    addMessage(reply,"received");

  },800);
}

// ================= GEMINI API =================
async function generateReply(text){

  // store history
  history.push({
    role:"user",
    parts:[{text:text}]
  });

  try{
    let res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + AIzaSyBGc2HI9VW2wGa0lP4GKJM-VLQVcDQbSjI,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          contents: history
        })
      }
    );

    let data = await res.json();

    let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";

    // store AI reply
    history.push({
      role:"model",
      parts:[{text:reply}]
    });

    return reply;

  }catch(err){
    return "Error connecting AI 😅";
  }
}

// ================= UI =================
function addMessage(content,type){
  let div=document.createElement("div");
  div.className="message "+type;

  let time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  div.innerHTML=content+`<div>${time}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
  let div=document.createElement("div");
  div.className="message received";
  div.id="typing";
  div.innerHTML=`<div class="typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
}

function removeTyping(){
  let t=document.getElementById("typing");
  if(t) t.remove();
}

// ENTER KEY
document.getElementById("msg").addEventListener("keypress",function(e){
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
