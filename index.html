<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chatbot</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

  <div class="app-shell">
    <div class="aurora-bg"></div>

    <aside class="glass-sidebar">
        <div class="brand">
            <div class="logo-icon"></div>
            <span>AETHER AI</span>
        </div>
        <button class="new-btn" onclick="location.reload()">+ New Project</button>
        <div class="nav-links">
            <div class="nav-item active">Dashboard</div>
            <div class="nav-item">Archive</div>
            <div class="nav-item">Settings</div>
        </div>
    </aside>

    <main class="workspace">
        <header class="top-bar">
            <div class="status-indicator">
                <span class="pulse-dot"></span>
                <span>Gemini 2.5 Flash Connected</span>
            </div>
        </header>

        <section id="chat">
            </section>

        <footer class="input-area">
            <div class="input-glass-wrapper">
                <textarea id="msg" placeholder="Type your command..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">
                  <i class="fa fa-paper-plane" aria-hidden="true"></i>
                </button>
            </div>
        </footer>
    </main>
</div>

  <script src="./script.js"></script>

</body>

</html>
