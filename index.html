<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chatbot</title>

  <link rel="stylesheet" href="./style.css">

</head>

<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">Gemini AI</div>
      <button class="new-chat">+ New Chat</button>
      <div class="history-label">Recent History</div>
      <div id="history-list"></div>
    </aside>

    <main class="chat-wrapper">
      <header class="mobile-header">
        <span>Gemini AI</span>
      </header>

      <div id="chat">
        <div class="message received">
          Hello! I'm optimized for your device. How can I help you today?
          <span class="timestamp">Just now</span>
        </div>
      </div>

      <div class="input-container">
        <div class="input-box">
          <input type="text" id="msg" placeholder="Message Gemini..." autocomplete="off">
          <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
        </div>
        <p class="disclaimer">Gemini may provide inaccurate info. Check its responses.</p>
      </div>
    </main>
  </div>

  <script src="./script.js"></script>

</body>

</html>
